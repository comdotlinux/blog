name: Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Node.js and Bun from mise.toml
        uses: jdx/mise-action@v5

      - name: Check .nvmrc matches mise.toml
        run: |
          node --version
          bun --version
          test "v$(cat .nvmrc)" = "$(node --version)" || { echo ".nvmrc ($(cat .nvmrc)) differs from mise.toml node ($(node --version)); Cloudflare Pages reads .nvmrc"; exit 1; }

      - name: Install dependencies
        run: bun install

      - name: Run linter
        run: bun run lint

      - name: Build site
        run: bun run build

      - name: Run unit tests
        run: bun run test:run

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run e2e tests
        run: bun run test:e2e

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: http://localhost:4321/
          uploadArtifacts: true
          temporaryPublicStorage: false
          configPath: ./lighthouserc.json
          runs: 3

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
